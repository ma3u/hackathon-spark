<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>graph-protokoll — Sitzungsmitschnitt → Knowledge Graph + Faktencheck</title>
    <style>
      :root {
        --bg: #0d1117; --panel: #161b22; --border: #30363d;
        --text: #c9d1d9; --muted: #8b949e; --accent: #58a6ff;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
      header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex;
        align-items: center; gap: 16px; flex-wrap: wrap; }
      header h1 { font-size: 17px; margin: 0; font-weight: 600; }
      header .sub { color: var(--muted); font-size: 12px; }
      .tabs { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
      .tab { background: var(--panel); color: var(--text); border: 1px solid var(--border);
        padding: 7px 14px; border-radius: 7px; cursor: pointer; font-size: 13px; }
      .tab.active { border-color: var(--accent); color: var(--accent); }
      #wrap { display: flex; height: calc(100vh - 56px); }
      #graph { flex: 1; position: relative; min-width: 0; overflow: hidden; }
      #side { width: 380px; border-left: 1px solid var(--border); overflow-y: auto; padding: 16px; }
      @media (max-width: 760px) {
        #wrap { flex-direction: column; height: auto; }
        #graph { height: 58vh; }
        #side { width: auto; border-left: none; border-top: 1px solid var(--border); }
      }
      .card { background: var(--panel); border: 1px solid var(--border); border-radius: 9px;
        padding: 13px; margin-bottom: 12px; }
      .card h2 { font-size: 13px; margin: 0 0 9px; text-transform: uppercase; letter-spacing: .04em;
        color: var(--muted); }
      .legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
        margin: 3px 9px 3px 0; }
      .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
      .prop { font-size: 12.5px; margin: 4px 0; word-break: break-word; }
      .prop b { color: var(--muted); font-weight: 500; }
      .fc { font-size: 12.5px; border-left: 3px solid var(--border); padding: 6px 10px; margin: 8px 0; }
      .fc.bestätigt { border-color: #3fb950; } .fc.falsch { border-color: #f85149; }
      .fc.irreführend { border-color: #d29922; } .fc.unbelegt { border-color: #8b949e; }
      .fc .verdikt { font-weight: 600; } .fc .src { color: var(--muted); font-size: 11px; }
      .cite { color: var(--accent); font-size: 11.5px; cursor: pointer; }
      audio { width: 100%; margin-top: 8px; }
      a { color: var(--accent); }
      #dash { height: calc(100vh - 56px); overflow-y: auto; padding: 20px;
        display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 14px; align-content: start; }
      .empty { color: var(--muted); font-size: 12.5px; font-style: italic; }
      .kpi { display: flex; gap: 18px; flex-wrap: wrap; }
      .kpi .n { font-size: 24px; font-weight: 700; color: var(--accent); }
      .kpi .l { font-size: 11px; color: var(--muted); text-transform: uppercase; }
      .bar { display: grid; grid-template-columns: 160px 1fr 64px; align-items: center; gap: 10px; margin: 6px 0; font-size: 12px; }
      .bar > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .bar .track { background: #21262d; border-radius: 4px; height: 14px; overflow: hidden; }
      .bar .fill { height: 100%; background: var(--accent); min-width: 3px; border-radius: 4px; }
      .bar .fill.pos { background: #3fb950; } .bar .fill.neg { background: #f85149; }
      .split { display: flex; height: 13px; border-radius: 4px; overflow: hidden; background: #21262d; }
      .num { text-align: right; color: var(--muted); }
      .glfail { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        padding: 32px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.65; }
      .glfail .inner { max-width: 460px; }
      .glfail b { color: var(--text); }
      .glfail code { background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
        padding: 1px 5px; color: var(--accent); font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>🎙️ graph-protokoll</h1>
        <div class="sub">Audiomitschnitt → Protokoll-Knowledge-Graph + Faktencheck · SPARK Challenge 2</div>
      </div>
      <div class="tabs">
        <button class="tab active" data-s="gemeinderat">Gemeinderat</button>
        <button class="tab" data-s="bundestag">Bundestag (Audio)</button>
        <button class="tab" data-s="bundestag_xml">Bundestag (amtliches XML)</button>
        <button class="tab" data-s="bundestag_real"
          title="Echtes amtliches Plenarprotokoll WP20/214 (18.03.2025, gemeinfrei §5 UrhG). Faktencheck bewusst aus – keine automatischen Verdikte über reale Personen.">Bundestag (echt) 🟢</button>
        <button class="tab" data-s="bundestag_yt"
          title="YouTube-Mitschnitt (@bundestag, 81. Sitzung 22.05.2026, Arbeitszeitpolitik) mit Zeit-Deeplinks und KI-Faktencheck (Mistral, ungeprüfte Vorschläge).">Bundestag (YouTube) 🎬</button>
        <select class="tab" id="sessions" title="Reale Sitzungen — YouTube-Mitschnitt (🎬) bzw. amtliches Protokoll (🟢)"><option value="">📺 Reale Sitzung…</option></select>
        <button class="tab" id="viewToggle">📊 Dashboard</button>
        <button class="tab" id="a11y" title="Barrierefreie Vorlesefassung (Screenreader/TTS)">♿ Vorlesefassung</button>
      </div>
    </header>
    <div id="dash" style="display:none"></div>
    <div id="wrap">
      <div id="graph"></div>
      <div id="side">
        <div class="card" id="meta"></div>
        <div class="card legend" id="legend"><h2>Ontologie-Schichten</h2></div>
        <div class="card" id="detail"><h2>Knoten</h2><div class="muted">Knoten anklicken…</div></div>
        <div class="card" id="factcheck" style="display:none"><h2>🔎 Faktencheck</h2></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>
    <script>
      const LAYER = {
        normativ:    { c: "#7d3c98", label: "L1 Normativ (Normen)" },
        zeitlich:    { c: "#2471a3", label: "L2 Zeitlich (Sitzung/Fristen)" },
        prozedural:  { c: "#1e8449", label: "L3 Prozedural (TOP→Beschluss)" },
        fallbezug:   { c: "#ca6f1e", label: "L4 Fallbezug (Person/Aussage)" },
        faktencheck: { c: "#c0392b", label: "Faktencheck (Verdikt/Quelle)" },
        provenienz:  { c: "#566573", label: "Provenienz (Audiosegment)" },
      };
      const color = (n) => (LAYER[n.schicht] || { c: "#999" }).c;
      const $ = (id) => document.getElementById(id);

      // Fraktions-Farben (dark-theme-tauglich) für klar erkennbare Balken statt Grau.
      const PARTY = {
        "CDU/CSU": "#bfc7d0", "SPD": "#e3000f", "BÜNDNIS 90/DIE GRÜNEN": "#3fbf46",
        "FDP": "#ffd400", "AfD": "#009ee0", "Die Linke": "#be3075", "Linke": "#be3075",
        "BSW": "#ff7a00", "fraktionslos": "#8b949e", "fraktionslos ": "#8b949e",
      };
      const VERDICT = {
        "bestätigt": "#3fb950", "teilweise": "#d29922", "irreführend": "#d29922",
        "falsch": "#f85149", "unbelegt": "#8b949e",
      };
      // Echte Quelle je Szenario (Deeplink). Fiktive Szenarien: keine externe Quelle.
      const SOURCE = {
        bundestag_real: {
          url: "https://www.bundestag.de/resource/blob/1057624/20214.xml",
          label: "Bundestag Open Data — Plenarprotokoll 20/214 (18.03.2025)",
          mediathek: "https://www.bundestag.de/mediathek",
        },
        bundestag_yt: {
          url: "https://www.youtube.com/watch?v=CPa1rLMiv64",
          label: "YouTube @bundestag — Arbeitszeitpolitik (81. Sitzung, 22.05.2026)",
        },
      };
      const partyColor = (f) => PARTY[(f || "").replace(/ /g, " ").trim()] || "#58a6ff";

      // Reale Sitzungen (web/data/sessions.json) + aktuell geladener Graph.
      let curData = null, SESSIONS = [];
      const entryFor = (sc) => SESSIONS.find(
        (e) => (e.youtube && e.youtube.name === sc) || (e.mediathek && e.mediathek.name === sc)
            || (e.amtlich && e.amtlich.name === sc));
      // Quelle/Deeplink-Infos: zuerst aus den Graph-Metadaten (skaliert über alle Sitzungen),
      // sonst aus der statischen SOURCE-Tabelle (Legacy-Demos).
      function srcInfo(data) {
        const m = (data && data.metadata) || {};
        if (m.quelle_url || m.video_id) return {
          url: m.quelle_url, label: m.quelle_label || m.quelle_url, video_id: m.video_id,
          pdf: m.amtliches_pdf, xml: m.amtliches_xml, typ: m.quelle_typ };
        return SOURCE[current] || null;
      }
      const ytLink = (vid, sec) => `https://www.youtube.com/watch?v=${vid}&t=${Math.floor(sec || 0)}s`;

      // 3D-Graph braucht WebGL (3d-force-graph → THREE.js). Ist WebGL aus (Hardware-
      // beschleunigung deaktiviert/sandboxed), darf die Init NICHT die ganze Seite lahmlegen:
      // gekapselt, damit Tabs, Dashboard und Vorlesefassung ohne WebGL weiterlaufen.
      let Graph = null;
      function webglVerfuegbar() {
        try {
          const c = document.createElement("canvas");
          return !!(window.WebGLRenderingContext &&
            (c.getContext("webgl") || c.getContext("experimental-webgl")));
        } catch { return false; }
      }
      function zeigeGraphFallback() {
        $("graph").innerHTML = `<div class="glfail"><div class="inner">
          🕸️ <b>3D-Graph nicht verfügbar</b> — WebGL ist in diesem Browser deaktiviert.<br/><br/>
          Hardware-Beschleunigung aktivieren: <code>chrome://settings</code> → System →
          „Hardwarebeschleunigung verwenden, wenn verfügbar" → neu laden.
          Status prüfen unter <code>chrome://gpu</code>.<br/><br/>
          <span class="muted">📊 Dashboard und ♿ Vorlesefassung funktionieren ohne WebGL.</span>
        </div></div>`;
      }
      function initGraph() {
        if (!webglVerfuegbar()) { zeigeGraphFallback(); return; }
        try {
          Graph = ForceGraph3D()($("graph"))
            .backgroundColor("#0d1117")
            .nodeColor(color)
            .nodeLabel((n) => `<b>${n.label}</b><br/><i>${n.type}</i>`)
            .nodeRelSize(5)
            // Beziehungen sichtbar machen (Default-Opacity 0.2 + dunkles Grau = unsichtbar):
            .linkColor(() => "#8b949e")
            .linkOpacity(0.55)
            .linkWidth(0.6)
            .linkDirectionalArrowLength(3.5)
            .linkDirectionalArrowRelPos(1)
            .linkDirectionalArrowColor(() => "#8b949e")
            .linkLabel((l) => l.relationship_type)
            .onNodeClick(showNode);
          requestAnimationFrame(sizeGraph);  // Canvas auf die Container-Breite zwingen
        } catch (e) {
          Graph = null;
          zeigeGraphFallback();
          console.warn("3D-Graph konnte nicht initialisiert werden:", e);
        }
      }

      // 3d-force-graph greift sonst die Fensterbreite ab und überdeckt das Seitenpanel
      // (Infobox). Wir zwingen den Canvas auf die tatsächliche Container-Breite.
      function sizeGraph() {
        if (!Graph) return;
        const el = $("graph");
        if (el.clientWidth > 0) Graph.width(el.clientWidth).height(el.clientHeight);
      }

      function toGraph(data) {
        const nodes = data.nodes.map((n) => ({ ...n }));
        const links = data.relationships.map((r) => ({
          ...r, source: r.source_id, target: r.target_id,
        }));
        return { nodes, links };
      }

      function showNode(n) {
        const skip = new Set(["id", "label", "type", "schicht"]);
        let html = `<h2>${n.type}</h2><div class="prop"><b>${n.label}</b></div>`;
        for (const [k, v] of Object.entries(n)) {
          if (skip.has(k) || v === "" || v == null || typeof v === "object") continue;
          if (["x", "y", "z", "vx", "vy", "vz", "index", "source_id", "target_id"].includes(k)) continue;
          if (k === "url" && /^https?:/.test(v)) {  // Quelle-Knoten: URL als Deeplink
            html += `<div class="prop"><b>url:</b> <a href="${v}" target="_blank" rel="noopener">${v}</a></div>`;
            continue;
          }
          html += `<div class="prop"><b>${k}:</b> ${v}</div>`;
        }
        const src = srcInfo(curData);
        if (n.type === "Transkriptsegment" && src) {  // Deeplink in die echte Quelle
          const t = Math.floor(n.start_sec || 0);
          const link = src.video_id ? ytLink(src.video_id, t)
            : (src.url ? `${src.url}${src.url.includes("?") ? "&" : "?"}t=${t}s` : null);
          if (link) html += `<div class="prop"><a class="cite" href="${link}" target="_blank" rel="noopener">▶ Quelle ansehen (${n.timecode}${t ? ", " + t + "s" : ""})</a></div>`;
        }
        if (n.type === "Transkriptsegment" && /\.(mp3|wav|m4a)$/i.test(n.audio_file || "")) {
          html += `<audio controls preload="none" src="./audio/${n.audio_file}#t=${Math.floor(n.start_sec || 0)}"></audio>`;
        }
        $("detail").innerHTML = html;
      }

      function renderMeta(data) {
        const m = (data && data.metadata) || {}, src = srcInfo(data), e = entryFor(current);
        const links = [];
        if (src && src.url) links.push(`<a href="${src.url}" target="_blank" rel="noopener">${src.label || src.url}</a>`);
        else if (src && src.mediathek) links.push(`<a href="${src.mediathek}" target="_blank" rel="noopener">Mediathek</a>`);
        if (src && src.pdf) links.push(`<a href="${src.pdf}" target="_blank" rel="noopener">amtliches PDF</a>`);
        if (src && src.xml) links.push(`<a href="${src.xml}" target="_blank" rel="noopener">amtl. XML</a>`);
        const prot = (e && e.youtube && e.youtube.protokoll) || (e && e.mediathek && e.mediathek.protokoll);
        if (prot) links.push(`<a href="./data/${prot}" target="_blank" rel="noopener">📄 Protokoll (HTML)</a>`);
        if (e && e.gap) links.push(`<a href="./data/${e.gap.file}" target="_blank" rel="noopener">🔀 Gap-Analyse (WER ${Math.round(e.gap.wer * 100)}%)</a>`);
        const quelle = links.length ? links.join(" · ") : (m.source_audio || "—");
        const herk = m.herkunft === "youtube" ? "🎬 YouTube-Mitschnitt (mit Zeit-Deeplinks)"
          : m.herkunft === "mediathek" ? "📺 Bundestag-Mediathek (korrigierte Untertitel, sprecher-attribuiert)"
          : m.herkunft === "amtlich" ? "🟢 amtliches Plenarprotokoll" : null;
        $("meta").innerHTML = `<h2>${m.title || "Protokoll-Graph"}</h2>
          <div class="prop"><b>Quelle:</b> ${quelle}</div>
          ${herk ? `<div class="prop"><b>Herkunft:</b> ${herk}</div>` : ""}
          <div class="prop"><b>Knoten:</b> ${m.node_count || 0} · <b>Beziehungen:</b> ${m.relationship_count || 0}</div>`;
      }

      function renderLegend() {
        $("legend").innerHTML = "<h2>Ontologie-Schichten</h2>" +
          Object.values(LAYER).map((l) =>
            `<span><span class="dot" style="background:${l.c}"></span>${l.label}</span>`).join("");
      }

      function renderFactcheck(data) {
        const checks = data.nodes.filter((n) => n.type === "Faktencheck");
        const box = $("factcheck");
        if (!checks.length) { box.style.display = "none"; return; }
        box.style.display = "block";
        const byId = Object.fromEntries(data.nodes.map((n) => [n.id, n]));
        const claimOf = (fcId) => {
          const r = data.relationships.find((r) => r.target_id === fcId && r.relationship_type === "GEPRUEFT_ALS");
          return r ? byId[r.source_id] : null;
        };
        const srcOf = (fcId) => {
          const r = data.relationships.find((r) => r.source_id === fcId && r.relationship_type === "BELEGT_MIT");
          return r ? byId[r.target_id] : null;
        };
        const segOf = (claim) => {  // Aussage → Transkriptsegment (für Zeit-Deeplink)
          if (!claim) return null;
          const r = data.relationships.find((r) => r.source_id === claim.id && r.relationship_type === "BELEGT_DURCH");
          return r ? byId[r.target_id] : null;
        };
        const mmss = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
        const src = srcInfo(data), disc = data.metadata && data.metadata.factcheck_disclaimer;
        box.innerHTML = "<h2>🔎 Faktencheck der Reden</h2>"
          + (disc ? `<div class="empty">⚠️ ${disc}</div>` : "")
          + checks.map((fc) => {
            const c = claimOf(fc.id), s = srcOf(fc.id), seg = segOf(c);
            let deep = "";
            if (src && seg && seg.start_sec != null && src.video_id) {
              const t = Math.floor(seg.start_sec);
              deep = ` · <a class="cite" href="${ytLink(src.video_id, t)}" target="_blank" rel="noopener">▶ im Video [${mmss(t)}]</a>`;
            }
            return `<div class="fc ${fc.verdikt}">
            <span class="verdikt">${fc.verdikt.toUpperCase()}</span> — ${c ? c.person : ""}<br/>
            „${c ? c.text : ""}"<br/>
            <span class="src">${fc.begruendung || ""}${s ? ` · Quelle: ${s.url ? `<a href="${s.url}" target="_blank" rel="noopener">${s.label}</a>` : s.label}${s.stand ? ` (Stand ${s.stand})` : ""}` : ""}${deep}</span></div>`;
          }).join("");
      }

      async function load(scenario) {
        current = scenario;
        let data;
        try { data = await (await fetch(`./data/${scenario}.json`)).json(); }
        catch {
          // Amtliche Sitzungen liegen als Vollgraph nur in Neo4j (zu groß für Pages) —
          // Quelle + Kennzahlen aus dem Index zeigen, Graph leeren.
          curData = null;
          const e = entryFor(scenario), m = { title: e ? `${e.nr}. Sitzung (amtlich)` : scenario };
          renderMeta({ metadata: { ...m, herkunft: "amtlich",
            amtliches_pdf: e && e.amtlich && e.amtlich.pdf, amtliches_xml: e && e.amtlich && e.amtlich.xml,
            quelle_url: e && e.amtlich && e.amtlich.pdf, quelle_label: "Bundestag Open Data (PDF)" } });
          if (Graph) Graph.graphData({ nodes: [], links: [] });
          $("factcheck").style.display = "none";
          $("detail").innerHTML = '<h2>Knoten</h2><div class="empty">Vollständiger Graph dieser amtlichen Sitzung liegt in Neo4j (zu groß für die Pages-Demo). Quelle &amp; Dashboard oben; Gap-Analyse vergleicht ihn mit dem YouTube-Mitschnitt.</div>';
          return;
        }
        curData = data;
        renderMeta(data); renderFactcheck(data);
        if (Graph) Graph.graphData(toGraph(data));
        $("detail").innerHTML = '<h2>Knoten</h2><div class="muted">Knoten anklicken…</div>';
      }

      let current = "gemeinderat", dashOn = false;

      function card(title, inner) {
        return `<div class="card"><h2>${title}</h2>${inner}</div>`;
      }
      function bars(rows, valKey, max, cls = "") {
        if (!rows.length) return "";
        const m = max || Math.max(1, ...rows.map((r) => r[valKey]));
        return rows.map((r) => {
          const w = Math.max(1.5, (100 * r[valKey]) / m);
          const style = `width:${w}%` + (r.color ? `;background:${r.color}` : "");
          return `<div class="bar"><span title="${String(r.label).replace(/"/g, "&quot;")}">${r.label}</span><span class="track">
             <span class="fill ${cls}" style="${style}"></span></span>
           <span class="num">${r.num}</span></div>`;
        }).join("");
      }
      const empty = (msg) => `<div class="empty">${msg}</div>`;
      async function loadDash(scenario) {
        const box = $("dash");
        let d;
        try { d = await (await fetch(`./data/${scenario}_dashboard.json`)).json(); }
        catch { box.innerHTML = card("Dashboard", "Für dieses Szenario liegen keine Kennzahlen vor."); return; }
        const k = d.kennzahlen;
        const kpi = card(`${d.sitzung.gremium} — ${d.sitzung.datum}`,
          `<div class="kpi">` + Object.entries({
            Reden: k.reden, Wörter: k.woerter, TOPs: k.tops,
            Saalreaktionen: k.saalreaktionen, "Geprüfte Aussagen": k.geprüfte_aussagen,
            ...(k.schriftliche_beitraege ? { "Schriftl. Beiträge": k.schriftliche_beitraege } : {}),
          }).map(([l, n]) => `<div><div class="n">${n}</div><div class="l">${l}</div></div>`).join("") + `</div>`);

        const themen = card("Top-Themen (nach Redevolumen)",
          bars(d.top_themen.map((t) => ({
            label: t.titel ? `${t.top}: ${t.titel}` : `TOP ${t.top}`,
            woerter: t.woerter, num: t.woerter, color: "#58a6ff",
          })), "woerter") || empty("Kein Redevolumen erfasst."));
        const sprach = card("Sprachanteil pro Fraktion",
          bars(d.sprachanteil_fraktion.map((s) => ({
            label: s.fraktion, prozent: s.prozent, num: s.prozent + "%", color: partyColor(s.fraktion),
          })), "prozent", 100) || empty("Keine Fraktions-Wortanteile."));

        const fb = (rows, t) => card(t, rows.length ? rows.map((r) => {
          const tot = r.positiv + r.negativ || 1;
          const label = r.fraktion || r.titel || ("TOP " + r.top);
          return `<div class="bar"><span title="${String(label).replace(/"/g, "&quot;")}">${label}</span>
            <span class="split"><span class="fill pos" style="width:${100 * r.positiv / tot}%"></span>
              <span class="fill neg" style="width:${100 * r.negativ / tot}%"></span></span>
            <span class="num">+${r.positiv}/−${r.negativ}</span></div>`;
        }).join("") : empty("Keine Saalreaktionen protokolliert (z. B. kommunale Sitzung)."));

        const bilanz = card("Faktencheck-Bilanz",
          Object.entries(d.faktencheck_bilanz).map(([v, n]) =>
            `<div class="bar"><span title="${v}">${v}</span><span class="track">
               <span class="fill" style="width:${Math.max(1.5, 100 * n / Math.max(1, k.geprüfte_aussagen))}%;background:${VERDICT[v] || "#58a6ff"}"></span></span>
             <span class="num">${n}</span></div>`).join("")
          || empty("Kein Faktencheck für diese Sitzung — bei echten Personen bewusst ohne automatische Verdikte."));

        box.innerHTML = kpi + themen + sprach
          + fb(d.feedback_erhalten_fraktion, "Feedback erhalten (Reaktionen auf Reden der Fraktion)")
          + fb(d.feedback_gegeben_fraktion, "Feedback gegeben (Beifall/Widerspruch durch Fraktion)")
          + fb(d.feedback_je_thema, "Stimmung je Thema (positiv/negativ)")
          + bilanz;
      }
      function setView() {
        $("dash").style.display = dashOn ? "grid" : "none";
        $("wrap").style.display = dashOn ? "none" : "flex";
        $("viewToggle").classList.toggle("active", dashOn);
        $("viewToggle").textContent = dashOn ? "🕸️ Graph" : "📊 Dashboard";
        if (dashOn) loadDash(current);
        else requestAnimationFrame(sizeGraph);  // beim Zurückschalten Canvas neu vermessen
      }

      document.querySelectorAll(".tab[data-s]").forEach((t) =>
        t.addEventListener("click", () => {
          document.querySelectorAll(".tab[data-s]").forEach((x) => x.classList.remove("active"));
          t.classList.add("active");
          $("sessions").value = "";
          current = t.dataset.s;
          dashOn ? loadDash(current) : load(current);
        }));
      $("viewToggle").addEventListener("click", () => { dashOn = !dashOn; setView(); });
      // Vorlesefassung/Protokoll: YouTube-Sitzung → HTML-Protokoll (Transkript + Deeplinks,
      // korrekte Umlaute); amtliche Sitzung → amtliches PDF; Legacy-Demo → TTS-Textfassung.
      $("a11y").addEventListener("click", () => {
        const e = entryFor(current), m = (curData && curData.metadata) || {};
        const hasProt = m.quelle_typ === "youtube" || m.quelle_typ === "mediathek"
          || (e && ((e.youtube && e.youtube.name === current) || (e.mediathek && e.mediathek.name === current)));
        if (hasProt) window.open(`./data/${current}_protokoll.html`, "_blank");
        else if (e && e.amtlich && e.amtlich.pdf) window.open(e.amtlich.pdf, "_blank");
        else window.open(`./data/${current}_barrierefrei.txt`, "_blank");
      });

      // Reale Sitzungen aus dem Index in den Auswahlknopf füllen.
      async function loadSessions() {
        try { const idx = await (await fetch("./data/sessions.json")).json(); SESSIONS = idx.sessions || []; }
        catch { SESSIONS = []; }
        const sel = $("sessions");
        if (!SESSIONS.length) { sel.style.display = "none"; return; }
        sel.innerHTML = `<option value="">📺 Reale Sitzung… (${SESSIONS.length})</option>` +
          SESSIONS.map((e) => {
            const sc = (e.youtube && e.youtube.name) || (e.mediathek && e.mediathek.name) || (e.amtlich && e.amtlich.name);
            const tag = e.youtube ? "🎬" : e.mediathek ? "📺" : "🟢";
            return `<option value="${sc}">${tag} ${e.nr}. Sitzung${e.datum ? " (" + e.datum + ")" : ""}</option>`;
          }).join("");
        sel.addEventListener("change", () => {
          if (!sel.value) return;
          document.querySelectorAll(".tab[data-s]").forEach((x) => x.classList.remove("active"));
          current = sel.value;
          dashOn ? loadDash(current) : load(current);
        });
      }

      window.addEventListener("resize", sizeGraph);
      initGraph();
      renderLegend();
      loadSessions();
      load("gemeinderat");
      requestAnimationFrame(sizeGraph);
    </script>
  </body>
</html>
