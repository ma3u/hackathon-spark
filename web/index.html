<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>graph-protokoll — Sitzungsmitschnitt → Knowledge Graph + Faktencheck</title>
    <style>
      /* Material Design · Bundestag-Look (Blau, helle Flächen, Elevation). Token-Namen bleiben
         (--bg/--panel/--border/--text/--muted/--accent) → Inline-Styles im JS funktionieren weiter. */
      :root {
        --accent: #16467f; --accent-d: #0e3160; --accent-l: #e9eff7;   /* Bundestag-Blau */
        --bg: #eef1f5; --panel: #ffffff; --panel-2: #f6f8fb; --border: #d6dde6;
        --text: #1a2330; --muted: #5b6776; --graph-bg: #0b2239;
        --ok: #1e8e3e; --warn: #e0922f; --err: #d23b3b; --neutral: #8a98a8;
        --e1: 0 1px 2px rgba(16,49,96,.06), 0 1px 3px rgba(16,49,96,.10);
        --e2: 0 4px 14px rgba(16,49,96,.14), 0 2px 4px rgba(16,49,96,.08);
        --r: 12px;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: "Roboto", "Segoe UI", system-ui, -apple-system, sans-serif;
        background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
      /* App-Bar (Bundestag-Blau) mit Material-Elevation */
      header { padding: 0 20px; min-height: 60px; background: var(--accent); color: #fff;
        display: flex; align-items: center; gap: 16px; flex-wrap: wrap; box-shadow: var(--e2);
        position: relative; z-index: 10; }
      header h1 { font-size: 18px; margin: 0; font-weight: 600; letter-spacing: .2px; }
      header .sub { color: rgba(255,255,255,.8); font-size: 12px; }
      .tabs { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; padding: 9px 0; }
      .tab { background: var(--panel); color: var(--accent); border: 1px solid var(--border);
        padding: 7px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 500;
        transition: background .15s, box-shadow .15s, color .15s; }
      .tab:hover { background: var(--accent-l); }
      .tab.active { background: var(--panel); color: var(--accent); border-color: var(--accent); box-shadow: var(--e1); }
      header .tab { background: rgba(255,255,255,.14); color: #fff; border-color: rgba(255,255,255,.3); }
      header .tab:hover { background: rgba(255,255,255,.26); }
      header .tab.active { background: #fff; color: var(--accent); border-color: #fff; }
      header select.tab option { color: var(--text); }
      .tab:focus-visible, .close:focus-visible, a:focus-visible, .gaplink:focus-visible {
        outline: 2px solid #fff; outline-offset: 2px; }
      #side .tab:focus-visible, #side a:focus-visible { outline-color: var(--accent); }
      #wrap { display: flex; height: calc(100vh - 60px); }
      #graph { flex: 1; position: relative; min-width: 0; overflow: hidden; background: var(--graph-bg); }
      #side { width: 384px; background: var(--bg); border-left: 1px solid var(--border); overflow-y: auto; padding: 16px; }
      @media (max-width: 760px) {
        #wrap { flex-direction: column; height: auto; }
        #graph { height: 58vh; }
        #side { width: auto; border-left: none; border-top: 1px solid var(--border); }
      }
      .card { background: var(--panel); border-radius: var(--r); box-shadow: var(--e1);
        padding: 14px 16px; margin-bottom: 14px; }
      .card h2 { font-size: 12px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .06em;
        color: var(--accent); font-weight: 600; }
      .legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
        margin: 3px 10px 3px 0; }
      .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
      .prop { font-size: 12.5px; margin: 5px 0; word-break: break-word; line-height: 1.5; }
      .prop b { color: var(--muted); font-weight: 600; }
      .fc { font-size: 12.5px; border-left: 4px solid var(--border); background: var(--panel-2);
        border-radius: 0 8px 8px 0; padding: 8px 10px; margin: 8px 0; }
      .fc.bestätigt { border-color: var(--ok); } .fc.falsch { border-color: var(--err); }
      .fc.teilweise { border-color: var(--warn); }
      .fc.irreführend { border-color: var(--warn); } .fc.unbelegt { border-color: var(--neutral); }
      .fc .verdikt { font-weight: 700; } .fc .src { color: var(--muted); font-size: 11px; }
      /* Mensch-im-Loop: Review-Steuerung am Faktencheck */
      .review { margin-top: 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .review button { background: var(--panel); color: var(--text); border: 1px solid var(--border);
        border-radius: 16px; padding: 3px 10px; font-size: 11px; cursor: pointer; }
      .review button:hover { border-color: var(--accent); color: var(--accent); }
      .review .rbadge { font-size: 11px; font-weight: 600; }
      .rbadge.ok { color: var(--ok); } .rbadge.rej { color: var(--err); } .rbadge.cor { color: var(--warn); }
      .rev-hint { color: var(--muted); font-size: 11px; margin: 2px 0 8px; }
      .rev-export { background: var(--accent-l); color: var(--accent); border: 1px solid transparent;
        border-radius: 16px; padding: 3px 10px; font-size: 11.5px; cursor: pointer; margin-left: 8px; font-weight: 500; }
      .cite { color: var(--accent); font-size: 11.5px; cursor: pointer; font-weight: 500; }
      audio { width: 100%; margin-top: 8px; }
      #dash { height: calc(100vh - 60px); overflow-y: auto; padding: 20px; background: var(--bg);
        display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 16px; align-content: start; }
      .empty { color: var(--muted); font-size: 12.5px; font-style: italic; }
      .kpi { display: flex; gap: 20px; flex-wrap: wrap; }
      .kpi .n { font-size: 26px; font-weight: 700; color: var(--accent); }
      .kpi .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
      .bar { display: grid; grid-template-columns: 160px 1fr 64px; align-items: center; gap: 10px; margin: 7px 0; font-size: 12px; }
      .bar > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .bar .track { background: #e6ebf1; border-radius: 6px; height: 16px; overflow: hidden; }
      .bar .fill { height: 100%; background: var(--accent); min-width: 3px; border-radius: 6px; }
      .bar .fill.pos { background: var(--ok); } .bar .fill.neg { background: var(--err); }
      .split { display: flex; height: 15px; border-radius: 6px; overflow: hidden; background: #e6ebf1; }
      .num { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
      .glfail { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        padding: 32px; text-align: center; color: #aab8c9; font-size: 13px; line-height: 1.65; }
      .glfail .inner { max-width: 460px; }
      .glfail b { color: #fff; }
      .glfail code { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22); border-radius: 4px;
        padding: 1px 5px; color: #cfe0f5; font-size: 12px; }
      /* Overlays (Material-Scrim) */
      .overlay { position: fixed; inset: 0; background: rgba(10,30,60,.45); display: none;
        align-items: flex-start; justify-content: center; z-index: 50; overflow: auto; padding: 4vh 16px;
        backdrop-filter: blur(2px); }
      .overlay.on { display: flex; }
      .modal { background: var(--panel); border-radius: 16px; box-shadow: var(--e2);
        max-width: 860px; width: 100%; padding: 22px 24px; }
      .modal h2 { margin: 0 0 4px; font-size: 16px; color: var(--text); }
      .modal .close { float: right; cursor: pointer; color: var(--muted); border: 1px solid var(--border);
        border-radius: 16px; padding: 3px 11px; background: var(--panel); }
      .modal .close:hover { color: var(--accent); border-color: var(--accent); }
      .gaphead { color: var(--muted); font-size: 12.5px; margin-bottom: 12px; line-height: 1.6; }
      .gaphead b { color: var(--text); }
      .videowrap { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000;
        border-radius: 10px; overflow: hidden; margin: 6px 0 10px; }
      .videowrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
      #videoOverlay .modal { width: min(880px, 94vw); }
      .difflegend { font-size: 11px; color: var(--muted); margin: 6px 0 14px; }
      .rede { border-top: 1px solid var(--border); padding: 11px 0; }
      .rede .who { font-size: 12.5px; color: var(--text); margin-bottom: 5px; font-weight: 500; }
      .rede .who span { color: var(--muted); font-weight: 400; }
      .diff { font-size: 13px; line-height: 1.7; }
      .diff .eq { color: var(--muted); }
      .diff .p { color: var(--accent); background: rgba(22,70,127,.10); border-radius: 3px; padding: 0 2px; }
      .diff .g { color: #b9621f; text-decoration: line-through; text-decoration-color: rgba(185,98,31,.6); }
      .diff .r-old { color: var(--accent); }
      .diff .r-new { color: #b9621f; text-decoration: line-through; text-decoration-color: rgba(185,98,31,.6); }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>🎙️ graph-protokoll</h1>
        <div class="sub">Bundestags-Plenarprotokoll → Knowledge Graph + Faktencheck · echte Daten · SPARK Challenge 2</div>
      </div>
      <div class="tabs">
        <select class="tab" id="sessions" aria-label="Bundestagssitzung wählen" title="Reale Bundestagssitzung wählen"><option value="">📺 Sitzung wählen…</option></select>
        <button class="tab" id="srcOff" title="Offiziell: amtliches Plenarprotokoll-XML (Struktur, Volltext, Saalreaktionen, Faktencheck) + Mediathek-Video je Rede">🟢 Offiziell</button>
        <button class="tab" id="srcYt" title="YouTube-Gesamtmitschnitt (Zeit-Deeplinks)">🎬 YouTube</button>
        <button class="tab" id="viewToggle">📊 Dashboard</button>
        <button class="tab" id="a11y" title="Protokoll als HTML — Transkript, Quellen, Deeplinks">♿ Protokoll</button>
        <a class="tab" href="aggregate.html" title="Aggregat über alle Sitzungen — Themen, Redner:innen, Faktencheck, Trends, Fun Facts">📈 Gesamt-Dashboard</a>
      </div>
    </header>
    <div class="overlay" id="gapOverlay" role="dialog" aria-modal="true" aria-label="Gap-Diff: Protokoll gegen gesprochenes Wort"><div class="modal" id="gapModal"></div></div>
    <div class="overlay" id="videoOverlay" role="dialog" aria-modal="true" aria-label="Video-Player"><div class="modal" id="videoModal"></div></div>
    <main id="content">
    <div id="dash" style="display:none"></div>
    <div id="wrap">
      <div id="graph"></div>
      <div id="side">
        <div class="card" id="meta"></div>
        <div class="card legend" id="legend"><h2>Ontologie-Schichten</h2></div>
        <div class="card" id="detail"><h2>Knoten</h2><div class="muted">Knoten anklicken…</div></div>
        <div class="card" id="factcheck" style="display:none"><h2>🔎 Faktencheck</h2></div>
      </div>
    </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>
    <script>
      // Plain-language Schicht-Labels (kein L1/L2/L3-Jargon) — die Farbe sagt, WAS der Knoten ist.
      const LAYER = {
        normativ:    { c: "#a569bd", label: "📜 Regeln & Normen" },
        zeitlich:    { c: "#2471a3", label: "🗓️ Sitzung & Zeit" },
        prozedural:  { c: "#1e8449", label: "📋 Ablauf: TOP → Antrag → Abstimmung → Beschluss" },
        fallbezug:   { c: "#ca6f1e", label: "👤 Personen, Fraktionen & Reden" },
        reaktion:    { c: "#16a085", label: "👏 Saalreaktionen (Beifall/Zwischenruf)" },
        faktencheck: { c: "#c0392b", label: "✅ Faktencheck (Verdikt + Quelle)" },
        provenienz:  { c: "#566573", label: "🎧 Beleg (Transkript / Audio-Sekunde)" },
      };
      const color = (n) => (LAYER[n.schicht] || { c: "#999" }).c;
      const $ = (id) => document.getElementById(id);

      // Fraktions-Farben (dark-theme-tauglich) für klar erkennbare Balken statt Grau.
      const PARTY = {
        "CDU/CSU": "#bfc7d0", "SPD": "#e3000f", "BÜNDNIS 90/DIE GRÜNEN": "#3fbf46",
        "FDP": "#ffd400", "AfD": "#009ee0", "Die Linke": "#be3075", "Linke": "#be3075",
        "BSW": "#ff7a00", "fraktionslos": "#8b949e", "fraktionslos ": "#8b949e",
      };
      const VERDICT = {
        "bestätigt": "#3fb950", "teilweise": "#d29922", "irreführend": "#d29922",
        "falsch": "#f85149", "unbelegt": "#8b949e",
      };
      const partyColor = (f) => PARTY[(f || "").replace(/ /g, " ").trim()] || "#58a6ff";

      // Reale Sitzungen (web/data/sessions.json) + aktuell geladener Graph + Quelle.
      let curData = null, SESSIONS = [], curSession = null, curSrc = "off";
      const entryFor = (sc) => SESSIONS.find(
        (e) => (e.youtube && e.youtube.name === sc) || (e.amtlich && e.amtlich.name === sc));
      // Quelle/Deeplink-Infos aus den Graph-Metadaten (jede reale Sitzung trägt quelle_url).
      function srcInfo(data) {
        const m = (data && data.metadata) || {};
        if (m.quelle_url || m.video_id) return {
          url: m.quelle_url, label: m.quelle_label || m.quelle_url, video_id: m.video_id,
          pdf: m.amtliches_pdf, xml: m.amtliches_xml, typ: m.quelle_typ };
        return null;
      }
      const ytLink = (vid, sec) => `https://www.youtube.com/watch?v=${vid}&t=${Math.floor(sec || 0)}s`;
      // Eingebetteter Player: YouTube über nocookie-Embed mit Startsekunde; Mediathek/sonst direkt.
      const ytEmbed = (vid, sec) => `https://www.youtube-nocookie.com/embed/${vid}?start=${Math.floor(sec || 0)}&autoplay=1&rel=0`;

      // 3D-Graph braucht WebGL (3d-force-graph → THREE.js). Ist WebGL aus (Hardware-
      // beschleunigung deaktiviert/sandboxed), darf die Init NICHT die ganze Seite lahmlegen:
      // gekapselt, damit Tabs, Dashboard und Vorlesefassung ohne WebGL weiterlaufen.
      let Graph = null;
      function webglVerfuegbar() {
        try {
          const c = document.createElement("canvas");
          return !!(window.WebGLRenderingContext &&
            (c.getContext("webgl") || c.getContext("experimental-webgl")));
        } catch { return false; }
      }
      function zeigeGraphFallback(grund) {
        const lost = grund === "lost";
        const ursache = lost
          ? "der WebGL-Kontext ist verloren gegangen (GPU-Prozess abgestürzt/zurückgesetzt)."
          : "WebGL ist in diesem Browser deaktiviert.";
        const hilfe = lost ? ""
          : "Hardware-Beschleunigung aktivieren: <code>chrome://settings</code> &rarr; System &rarr; "
            + "Hardwarebeschleunigung &rarr; neu laden. Status: <code>chrome://gpu</code>.<br/><br/>";
        $("graph").innerHTML = '<div class="glfail"><div class="inner">'
          + "🕸️ <b>3D-Graph nicht verfügbar</b> — " + ursache + "<br/><br/>"
          + hilfe
          + '<button class="tab" onclick="location.reload()" style="margin-bottom:12px">🔄 Seite neu laden</button><br/>'
          + '<span class="muted">📊 Dashboard und ♿ Protokoll funktionieren auch ohne WebGL.</span>'
          + "</div></div>";
      }
      function initGraph() {
        if (!webglVerfuegbar()) { zeigeGraphFallback(); return; }
        try {
          Graph = ForceGraph3D()($("graph"))
            .backgroundColor("#0b2239")
            .nodeColor(color)
            .nodeLabel((n) => `<b>${n.label}</b><br/><i>${n.type}</i>`)
            .nodeRelSize(5)
            // Beziehungen sichtbar machen (Default-Opacity 0.2 + dunkles Grau = unsichtbar):
            .linkColor(() => "#8b949e")
            .linkOpacity(0.55)
            .linkWidth(0.6)
            .linkDirectionalArrowLength(3.5)
            .linkDirectionalArrowRelPos(1)
            .linkDirectionalArrowColor(() => "#8b949e")
            .linkLabel((l) => l.relationship_type)
            .onNodeClick(showNode);
          requestAnimationFrame(sizeGraph);  // Canvas auf die Container-Breite zwingen
          // GPU-Kontextverlust (z. B. abgestürzter GPU-Prozess) abfangen → Fallback statt
          // leerer/„kaputter" Canvas. Nach einem Frame prüfen, ob wirklich gerendert wird.
          requestAnimationFrame(() => {
            const cv = $("graph").querySelector("canvas");
            if (!cv) { Graph = null; zeigeGraphFallback(); return; }
            cv.addEventListener("webglcontextlost", (ev) => {
              ev.preventDefault(); Graph = null; zeigeGraphFallback("lost");
            }, { once: true });
          });
        } catch (e) {
          Graph = null;
          zeigeGraphFallback();
          console.warn("3D-Graph konnte nicht initialisiert werden:", e);
        }
      }

      // 3d-force-graph greift sonst die Fensterbreite ab und überdeckt das Seitenpanel
      // (Infobox). Wir zwingen den Canvas auf die tatsächliche Container-Breite.
      function sizeGraph() {
        if (!Graph) return;
        const el = $("graph");
        if (el.clientWidth > 0) Graph.width(el.clientWidth).height(el.clientHeight);
      }

      function toGraph(data) {
        const nodes = data.nodes.map((n) => ({ ...n }));
        const links = data.relationships.map((r) => ({
          ...r, source: r.source_id, target: r.target_id,
        }));
        return { nodes, links };
      }

      function showNode(n) {
        const skip = new Set(["id", "label", "type", "schicht"]);
        let html = `<h2>${n.type}</h2><div class="prop"><b>${n.label}</b></div>`;
        for (const [k, v] of Object.entries(n)) {
          if (skip.has(k) || v === "" || v == null || typeof v === "object") continue;
          if (["x", "y", "z", "vx", "vy", "vz", "index", "source_id", "target_id"].includes(k)) continue;
          if (k === "url" && /^https?:/.test(v)) {  // Quelle-Knoten: URL als Deeplink
            html += `<div class="prop"><b>url:</b> <a href="${v}" target="_blank" rel="noopener">${v}</a></div>`;
            continue;
          }
          if (k === "video_url" && /^https?:/.test(v)) {  // Redebeitrag: Mediathek-Video je Rede (eingebettet)
            html += `<div class="prop"><a class="cite playvid" href="${v}" data-embed="${v}" data-orig="${v}" data-title="${esc(n.label || "Rede")} — Mediathek">▶ Rede im Video (Mediathek)</a></div>`;
            continue;
          }
          if (k === "dip_url" && /^https?:/.test(v)) {  // Person: amtliches DIP-Profil
            html += `<div class="prop"><a class="cite" href="${v}" target="_blank" rel="noopener">🏛 DIP-Profil (Bundestag)</a></div>`;
            continue;
          }
          html += `<div class="prop"><b>${k}:</b> ${v}</div>`;
        }
        const src = srcInfo(curData);
        if (n.type === "Transkriptsegment" && src) {  // Deeplink in die echte Quelle (eingebettet)
          const t = Math.floor(n.start_sec || 0);
          const link = src.video_id ? ytLink(src.video_id, t)
            : (src.url ? `${src.url}${src.url.includes("?") ? "&" : "?"}t=${t}s` : null);
          if (link) {
            const emb = src.video_id ? ytEmbed(src.video_id, t) : link;
            html += `<div class="prop"><a class="cite playvid" href="${link}" data-embed="${emb}" data-orig="${link}" data-title="Beleg ${n.timecode || ""}">▶ Quelle ansehen (${n.timecode}${t ? ", " + t + "s" : ""})</a></div>`;
          }
        }
        if (n.type === "Transkriptsegment" && /\.(mp3|wav|m4a)$/i.test(n.audio_file || "")) {
          html += `<audio controls preload="none" src="./audio/${n.audio_file}#t=${Math.floor(n.start_sec || 0)}"></audio>`;
        }
        // Faktencheck zum AUSGEWÄHLTEN Knoten (Aussage/Person/Faktencheck) direkt im Panel
        if (curData) {
          const byId = Object.fromEntries(curData.nodes.map((x) => [x.id, x]));
          const rels = curData.relationships, fcList = [];
          const fcForAussage = (aid) => rels
            .filter((r) => r.source_id === aid && r.relationship_type === "GEPRUEFT_ALS")
            .forEach((r) => { const fc = byId[r.target_id]; if (fc) fcList.push({ fc, claim: byId[aid] }); });
          if (n.type === "Faktencheck") {
            const cr = rels.find((r) => r.target_id === n.id && r.relationship_type === "GEPRUEFT_ALS");
            fcList.push({ fc: n, claim: cr ? byId[cr.source_id] : null });
          } else if (n.type === "Aussage") fcForAussage(n.id);
          else if (n.type === "Person") rels
            .filter((r) => r.source_id === n.id && r.relationship_type === "TAETIGT_AUSSAGE")
            .forEach((r) => fcForAussage(r.target_id));
          if (fcList.length) {
            const srcOf = (id) => { const r = rels.find((r) => r.source_id === id && r.relationship_type === "BELEGT_MIT"); return r ? byId[r.target_id] : null; };
            html += `<div class="prop" style="margin-top:10px"><b>🔎 Faktencheck zu diesem Knoten (${fcList.length})</b></div>`;
            html += fcList.slice(0, 6).map(({ fc, claim }) => {
              const q = srcOf(fc.id), col = VERDICT[fc.verdikt] || "#8b949e";
              return `<div class="fc ${fc.verdikt}" style="border-color:${col}"><span class="verdikt" style="color:${col}">${(fc.verdikt || "").toUpperCase()}</span>${claim && claim.person ? " — " + esc(claim.person) : ""}<br/>`
                + (claim && claim.text ? `„${esc(claim.text)}"<br/>` : "")
                + `<span class="src">${esc(fc.begruendung || "")}${q ? ` · Quelle: ${q.url ? `<a href="${esc(q.url)}" target="_blank" rel="noopener">${esc(q.label || q.url)}</a>` : esc(q.label || "")}` : ""}</span></div>`;
            }).join("");
          }
        }
        $("detail").innerHTML = html;
      }

      function renderMeta(data) {
        const m = (data && data.metadata) || {}, src = srcInfo(data), e = entryFor(current);
        const links = [];
        if (src && src.url) links.push(`<a href="${src.url}" target="_blank" rel="noopener">${src.label || src.url}</a>`);
        else if (src && src.mediathek) links.push(`<a href="${src.mediathek}" target="_blank" rel="noopener">Mediathek</a>`);
        if (src && src.pdf) links.push(`<a href="${src.pdf}" target="_blank" rel="noopener">amtliches PDF</a>`);
        if (src && src.xml) links.push(`<a href="${src.xml}" target="_blank" rel="noopener">amtl. XML</a>`);
        // Mediathek-Video je Sitzung (auch ohne committeten Graphen verfügbar) — Sitzungseinstieg.
        if (e && e.amtlich && e.amtlich.mediathek)
          links.push(`<a href="${e.amtlich.mediathek}" target="_blank" rel="noopener">📺 Mediathek (Video${e.amtlich.mediathek_verlinkt ? ", " + e.amtlich.mediathek_verlinkt + " Reden verlinkt" : ""})</a>`);
        const prot = curSrc === "yt" ? (e && e.youtube && e.youtube.protokoll)
                                     : (e && e.amtlich && e.amtlich.protokoll);
        if (prot) links.push(`<a href="./data/${prot}" target="_blank" rel="noopener">📄 Protokoll (HTML)</a>`);
        if (e && e.gap) {  // youtube = ASR-Gap (Auto-Caption ↔ amtlich), mediathek = Korrektur-Gap (gesprochen ↔ Protokoll)
          const gl = e.gap.typ === "mediathek" ? "Korrektur-Gap" : "ASR-Gap";
          links.push(`<a href="#" class="gaplink" data-file="${e.gap.file}" title="Wort-Diff anzeigen">🔀 ${gl} (WER ${Math.round(e.gap.wer * 100)}%)</a>`);
        }
        const quelle = links.length ? links.join(" · ") : (m.source_audio || "—");
        const herk = m.herkunft === "youtube" ? "🎬 YouTube-Mitschnitt (mit Zeit-Deeplinks)"
          : m.herkunft === "mediathek" ? "📺 Bundestag-Mediathek (korrigierte Untertitel, sprecher-attribuiert)"
          : m.herkunft === "amtlich" ? "🟢 amtliches Plenarprotokoll" : null;
        const ytNote = e && !e.youtube
          ? `<div class="prop" style="color:var(--muted)">🎬 Kein YouTube-Gesamtmitschnitt für diese Sitzung — YouTube gibt nur die ~5 jüngsten Streams frei (vorhanden: 79, 81). Amtliches XML deckt alle 82 Sitzungen ab.</div>`
          : "";
        // ▶ Video der ganzen Sitzung: YouTube-Stream (einbettbar) bevorzugt, sonst Mediathek (öffnet im Tab, CSP).
        let vid = null;
        if (src && src.video_id)
          vid = { embed: ytEmbed(src.video_id, 0), orig: ytLink(src.video_id, 0),
                  label: "▶ Video der Sitzung (YouTube)", title: (m.title || "Sitzung") + " — YouTube" };
        else if (e && e.amtlich && e.amtlich.mediathek)
          vid = { embed: e.amtlich.mediathek, orig: e.amtlich.mediathek,
                  label: "▶ Video der Sitzung (Mediathek)", title: (m.title || "Sitzung") + " — Mediathek" };
        $("meta").innerHTML = `<h2>${m.title || "Protokoll-Graph"}</h2>
          <div class="prop"><b>Quelle:</b> ${quelle}</div>
          ${herk ? `<div class="prop"><b>Herkunft:</b> ${herk}</div>` : ""}
          <div class="prop"><b>Knoten:</b> ${m.node_count || 0} · <b>Beziehungen:</b> ${m.relationship_count || 0}</div>
          ${vid ? `<div class="prop"><a class="cite playvid" href="${vid.orig}" data-embed="${vid.embed}" data-orig="${vid.orig}" data-title="${esc(vid.title)}">${vid.label}</a></div>` : ""}
          ${ytNote}`;
      }

      // Legende DYNAMISCH: nur Schichten zeigen, die im aktuellen Graph wirklich vorkommen
      // (+ Anzahl) — so „passt" die Ontologie zu den Daten (keine leeren L1-Normen etc.).
      function renderLegend(data) {
        const present = {};
        ((data && data.nodes) || []).forEach((n) => { if (n.schicht) present[n.schicht] = (present[n.schicht] || 0) + 1; });
        const keys = Object.keys(LAYER).filter((k) => present[k]);
        $("legend").innerHTML = "<h2>Bedeutungs-Ebenen</h2>"
          + '<div class="muted" style="font-size:11px;margin:-2px 0 8px">Die Farbe sagt, <b>was</b> ein Knoten ist. Knoten anklicken → Details + Faktencheck rechts.</div>'
          + (keys.length
          ? keys.map((k) => `<span><span class="dot" style="background:${LAYER[k].c}"></span>${LAYER[k].label} <span style="color:var(--muted)">· ${present[k]}</span></span>`).join("")
          : '<div class="empty">Graph wählen…</div>');
      }

      function renderFactcheck(data) {
        const checks = data.nodes.filter((n) => n.type === "Faktencheck");
        const box = $("factcheck");
        if (!checks.length) { box.style.display = "none"; return; }
        box.style.display = "block";
        const byId = Object.fromEntries(data.nodes.map((n) => [n.id, n]));
        const claimOf = (fcId) => {
          const r = data.relationships.find((r) => r.target_id === fcId && r.relationship_type === "GEPRUEFT_ALS");
          return r ? byId[r.source_id] : null;
        };
        const srcOf = (fcId) => {
          const r = data.relationships.find((r) => r.source_id === fcId && r.relationship_type === "BELEGT_MIT");
          return r ? byId[r.target_id] : null;
        };
        const segOf = (claim) => {  // Aussage → Transkriptsegment (für Zeit-Deeplink, YouTube)
          if (!claim) return null;
          const r = data.relationships.find((r) => r.source_id === claim.id && r.relationship_type === "BELEGT_DURCH");
          return r ? byId[r.target_id] : null;
        };
        // Amtlich: kein Transkriptsegment in der Pages-Projektion → Deeplink über den
        // passenden Redebeitrag (gleiche Person, möglichst gleicher TOP) → Mediathek-Video.
        const redeOf = (claim) => {
          if (!claim) return null;
          const pe = data.relationships.find((r) => r.target_id === claim.id && r.relationship_type === "TAETIGT_AUSSAGE");
          if (!pe) return null;
          const te = data.relationships.find((r) => r.source_id === claim.id && r.relationship_type === "ZU_TOP");
          const tid = te && te.target_id;
          const reden = data.relationships
            .filter((r) => r.source_id === pe.source_id && r.relationship_type === "HAT_REDEBEITRAG")
            .map((r) => byId[r.target_id]).filter((rb) => rb && rb.video_url);
          const sameTop = reden.find((rb) => tid && data.relationships.some(
            (r) => r.source_id === rb.id && r.relationship_type === "ZU_TOP" && r.target_id === tid));
          return sameTop || reden[0] || null;
        };
        const mmss = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
        const src = srcInfo(data), disc = data.metadata && data.metadata.factcheck_disclaimer;
        const rev = loadReview(current);
        const nrev = Object.keys(rev).length;
        box.innerHTML = `<h2>🔎 Faktencheck der Reden`
          + `<button class="rev-export" id="revExport" title="Menschliche Korrekturen als JSON herunterladen">⬇ Korrekturen (${nrev})</button></h2>`
          + (disc ? `<div class="empty">⚠️ ${disc}</div>` : "")
          + `<div class="rev-hint">Mensch-im-Loop: KI-Vorschläge freigeben ✓, ablehnen ✗ oder korrigieren ✎ — wird lokal gespeichert &amp; exportierbar.</div>`
          + checks.map((fc) => {
            const c = claimOf(fc.id), s = srcOf(fc.id), seg = segOf(c);
            let deep = "";
            if (src && seg && seg.start_sec != null && src.video_id) {  // YouTube: Zeit-Deeplink
              const t = Math.floor(seg.start_sec);
              deep = ` · <a class="cite playvid" href="${ytLink(src.video_id, t)}" data-embed="${ytEmbed(src.video_id, t)}" data-orig="${ytLink(src.video_id, t)}" data-title="${esc(c ? c.person : "Rede")} [${mmss(t)}]">▶ im Video [${mmss(t)}]</a>`;
            } else {                                                    // Amtlich: Mediathek-Rede
              const rb = redeOf(c);
              if (rb && rb.video_url) deep = ` · <a class="cite playvid" href="${rb.video_url}" data-embed="${rb.video_url}" data-orig="${rb.video_url}" data-title="${esc(c ? c.person : "Rede")} — Mediathek">▶ Rede im Video</a>`;
            }
            return `<div class="fc ${fc.verdikt}" data-fcid="${fc.id}" data-person="${esc(c ? c.person : "")}" data-aussage="${esc(c ? c.text : "")}" data-verdikt="${fc.verdikt}">
            <span class="verdikt">${fc.verdikt.toUpperCase()}</span> — ${c ? c.person : ""}<br/>
            „${c ? c.text : ""}"<br/>
            <span class="src">${fc.begruendung || ""}${s ? ` · Quelle: ${s.url ? `<a href="${s.url}" target="_blank" rel="noopener">${s.label}</a>` : s.label}${s.stand ? ` (Stand ${s.stand})` : ""}` : ""}${deep}</span>
            <div class="review">
              <button data-rev="ok" title="Verdikt freigeben">✓ Freigeben</button>
              <button data-rev="rej" title="Verdikt ablehnen">✗ Ablehnen</button>
              <button data-rev="cor" title="Verdikt korrigieren">✎ Korrigieren</button>
              <span class="rbadge">${reviewBadge(rev[fc.id])}</span>
            </div></div>`;
          }).join("");
      }

      // ── Mensch-im-Loop: Review-Zustand (localStorage je Sitzung) + Export ──────────
      const VERDIKTE = ["bestätigt", "teilweise", "irreführend", "falsch", "unbelegt"];
      const loadReview = (sit) => { try { return JSON.parse(localStorage.getItem("korr:" + sit) || "{}"); } catch { return {}; } };
      const saveReview = (sit, r) => localStorage.setItem("korr:" + sit, JSON.stringify(r));
      function reviewBadge(e) {
        if (!e) return "";
        if (e.status === "bestätigt") return `<span class="ok">✅ freigegeben</span>`;
        if (e.status === "abgelehnt") return `<span class="rej">✗ abgelehnt</span>`;
        if (e.status === "korrigiert") return `<span class="cor">✎ korrigiert → ${esc(e.verdikt_neu || "")}</span>`;
        return "";
      }

      // Daten immer frisch laden (kein Stale-Cache → keine Auswahl/Anzeige-Diskrepanz).
      const dataUrl = (f) => `./data/${f}?v=${Date.now()}`;
      async function load(scenario) {
        current = scenario;
        let data;
        try {
          const r = await fetch(dataUrl(`${scenario}.json`));
          if (!r.ok) throw new Error(r.status);
          data = await r.json();
        }
        catch {
          // Amtliche Sitzungen liegen als Vollgraph nur in Neo4j (zu groß für Pages) —
          // Quelle + Kennzahlen aus dem Index zeigen, Graph leeren.
          curData = null;
          const e = entryFor(scenario), m = { title: e ? `${e.nr}. Sitzung (amtlich)` : scenario };
          renderMeta({ metadata: { ...m, herkunft: "amtlich",
            amtliches_pdf: e && e.amtlich && e.amtlich.pdf, amtliches_xml: e && e.amtlich && e.amtlich.xml,
            quelle_url: e && e.amtlich && e.amtlich.pdf, quelle_label: "Bundestag Open Data (PDF)" } });
          if (Graph) Graph.graphData({ nodes: [], links: [] });
          $("factcheck").style.display = "none";
          $("detail").innerHTML = '<h2>Knoten</h2><div class="empty">Vollständiger Graph dieser amtlichen Sitzung liegt in Neo4j (zu groß für die Pages-Demo). Quelle &amp; Dashboard oben; Gap-Analyse vergleicht ihn mit dem YouTube-Mitschnitt.</div>';
          return;
        }
        curData = data;
        renderMeta(data); renderFactcheck(data); renderLegend(data);
        if (Graph) Graph.graphData(toGraph(data));
        $("detail").innerHTML = '<h2>Knoten</h2><div class="muted">Knoten anklicken…</div>';
      }

      let current = null, dashOn = false;

      function card(title, inner) {
        return `<div class="card"><h2>${title}</h2>${inner}</div>`;
      }
      function bars(rows, valKey, max, cls = "") {
        if (!rows.length) return "";
        const m = max || Math.max(1, ...rows.map((r) => r[valKey]));
        return rows.map((r) => {
          const w = Math.max(1.5, (100 * r[valKey]) / m);
          const style = `width:${w}%` + (r.color ? `;background:${r.color}` : "");
          return `<div class="bar"><span title="${String(r.label).replace(/"/g, "&quot;")}">${r.label}</span><span class="track">
             <span class="fill ${cls}" style="${style}"></span></span>
           <span class="num">${r.num}</span></div>`;
        }).join("");
      }
      const empty = (msg) => `<div class="empty">${msg}</div>`;
      async function loadDash(scenario) {
        const box = $("dash");
        let d;
        try { d = await (await fetch(dataUrl(`${scenario}_dashboard.json`))).json(); }
        catch { box.innerHTML = card("Dashboard", "Für dieses Szenario liegen keine Kennzahlen vor."); return; }
        const k = d.kennzahlen;
        const fmtTime = (min) => min ? `${Math.floor(min / 60)}h ${min % 60}m` : "—";
        const kpi = card(`${d.sitzung.gremium} — ${d.sitzung.datum}`,
          `<div class="kpi">` + Object.entries({
            Reden: k.reden, "Redezeit (ca.)": fmtTime(k.gesamtzeit_min), TOPs: k.tops,
            Saalreaktionen: k.saalreaktionen, "Geprüfte Aussagen": k.geprüfte_aussagen,
            ...(k.schriftliche_beitraege ? { "Schriftl. Beiträge": k.schriftliche_beitraege } : {}),
          }).map(([l, n]) => `<div><div class="n">${n}</div><div class="l">${l}</div></div>`).join("") + `</div>`);

        // Top-Themen = nach Sachthema (Migration, Ukraine, Haushalt …), nicht nur TOP-Nummer
        const themen = card("Top-Themen (nach Sachthema)",
          bars((d.sachthemen || []).map((t) => ({
            label: t.thema, woerter: t.woerter, num: t.woerter, color: "#58a6ff",
          })), "woerter") || empty("Keine Themen erkannt."));
        const redner = card("Redner:innen (nach Redezeit)",
          bars((d.redner || []).map((r) => ({
            label: r.name + (r.fraktion ? ` · ${r.fraktion}` : ""),
            woerter: r.woerter, num: fmtTime(Math.round(r.woerter / 130)), color: partyColor(r.fraktion),
          })), "woerter") || empty("Keine Redner erfasst."));
        const sprach = card("Sprachanteil pro Fraktion",
          bars(d.sprachanteil_fraktion.map((s) => ({
            label: s.fraktion, prozent: s.prozent, num: s.prozent + "%", color: partyColor(s.fraktion),
          })), "prozent", 100) || empty("Keine Fraktions-Wortanteile."));

        const fb = (rows, t) => card(t, rows.length ? rows.map((r) => {
          const tot = r.positiv + r.negativ || 1;
          const label = r.fraktion || r.titel || ("TOP " + r.top);
          return `<div class="bar"><span title="${String(label).replace(/"/g, "&quot;")}">${label}</span>
            <span class="split"><span class="fill pos" style="width:${100 * r.positiv / tot}%"></span>
              <span class="fill neg" style="width:${100 * r.negativ / tot}%"></span></span>
            <span class="num">+${r.positiv}/−${r.negativ}</span></div>`;
        }).join("") : empty("Keine Saalreaktionen protokolliert (z. B. kommunale Sitzung)."));

        const verd = d.faktencheck_bilanz || {};
        const nurUnbelegt = Object.keys(verd).length > 0 && Object.keys(verd).every((v) => v === "unbelegt");
        const bilanz = card("Faktencheck-Bilanz",
          (Object.entries(verd).map(([v, n]) =>
            `<div class="bar"><span title="${v}">${v}</span><span class="track">
               <span class="fill" style="width:${Math.max(1.5, 100 * n / Math.max(1, k.geprüfte_aussagen))}%;background:${VERDICT[v] || "#58a6ff"}"></span></span>
             <span class="num">${n}</span></div>`).join("") || empty("Kein Faktencheck für diese Sitzung."))
          + (nurUnbelegt ? empty("⚠️ Alle Verdikte unbelegt — das LLM (Mistral, Trainingsstand vor 2026) kann aktuelle Zahlen-Aussagen ohne Quellen nicht verifizieren. Belastbare Verdikte brauchen Retrieval gegen aktuelle amtliche Daten (Destatis · DIP · Bundesregierung) → Produktivpfad factcheck_with_retrieval.") : ""));

        box.innerHTML = kpi + themen + redner + sprach
          + fb(d.feedback_erhalten_fraktion, "Feedback erhalten (Reaktionen auf Reden der Fraktion)")
          + fb(d.feedback_gegeben_fraktion, "Feedback gegeben (Beifall/Widerspruch durch Fraktion)")
          + fb(d.feedback_je_thema, "Stimmung je Thema (positiv/negativ)")
          + bilanz;
      }
      // ── Gap-Diff-Overlay: Wort-Diff Protokoll ↔ gesprochenes Wort / ASR ──────────
      const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
      function renderDiff(segs) {
        return `<div class="diff">` + (segs || []).map((s) => {
          if (s[0] === "=") return `<span class="eq">${esc(s[1])}</span>`;
          if (s[0] === "p") return ` <span class="p" title="nur im Protokoll (redaktionell ergänzt)">${esc(s[1])}</span> `;
          if (s[0] === "g") return ` <span class="g" title="nur gesprochen (redaktionell entfernt)">${esc(s[1])}</span> `;
          if (s[0] === "r") return ` <span class="p">${esc(s[1])}</span>/<span class="g">${esc(s[2])}</span> `;
          return "";
        }).join(" ") + `</div>`;
      }
      let gapTrigger = null;
      function closeGap() {
        $("gapOverlay").classList.remove("on");
        const vo = $("videoOverlay");
        if (vo) { vo.classList.remove("on"); $("videoModal").innerHTML = ""; }  // Video stoppen
        if (gapTrigger) { gapTrigger.focus(); gapTrigger = null; }  // Fokus zurück zum Auslöser
      }
      // Eingebetteter Video-Player (advanced): YouTube-/Mediathek-Iframe im Overlay, Startsekunde,
      // Vollbild; „Original öffnen" als Fallback, falls die Einbettung gesperrt ist.
      function playVideo(ds) {
        // YouTube lässt sich einbetten (nocookie). Die Bundestag-Mediathek (dbtg.tv) verbietet
        // Framing per CSP (frame-ancestors) → dort sauber im neuen Tab öffnen statt schwarzem Kasten.
        const isYt = /youtube(?:-nocookie)?\.com\/embed/.test(ds.embed || "");
        if (!isYt) { window.open(ds.orig, "_blank", "noopener"); return; }
        const vo = $("videoOverlay"), m = $("videoModal");
        gapTrigger = document.activeElement;
        vo.classList.add("on");
        m.innerHTML = `<button class="close" type="button">✕ schließen</button>`
          + `<h2>▶ ${esc(ds.title || "Video")}</h2>`
          + `<div class="videowrap"><iframe src="${ds.embed}" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" loading="lazy"></iframe></div>`
          + `<div class="gaphead"><a href="${ds.orig}" target="_blank" rel="noopener">↗ Auf YouTube öffnen</a> · springt zur belegten Sekunde.</div>`;
        const cb = m.querySelector(".close");
        if (cb) cb.focus();
      }
      async function openGap(file) {
        const m = $("gapModal");
        gapTrigger = document.activeElement;
        $("gapOverlay").classList.add("on");
        m.innerHTML = `<button class="close" type="button">✕ schließen</button><div class="gaphead">Lade…</div>`;
        let d;
        try { d = await (await fetch(`./data/${file}?cb=${Date.now()}`)).json(); }
        catch { m.innerHTML = `<button class="close" type="button">✕ schließen</button><div class="gaphead">Konnte ${esc(file)} nicht laden.</div>`; return; }
        const w = d.wer || {}, med = d.quelle_typ === "mediathek";
        let h = `<button class="close" type="button">✕ schließen</button>`;
        h += `<h2>🔀 ${med ? "Korrektur-Gap" : "ASR-Gap"}${d.sitzung ? " — " + d.sitzung.nr + ". Sitzung" : ""}</h2>`;
        h += `<div class="gaphead">${esc(d.vergleich || "")}<br/>WER <b>${Math.round((w.wer || 0) * 100)}%</b>`
          + (w.ref_woerter ? ` · ${w.ref_woerter.toLocaleString("de")} Referenzwörter` : "")
          + (d.reden ? ` · ${d.reden.verglichen}/${d.reden.gesamt} Reden verglichen` : "") + `</div>`;
        if (med) {
          h += `<div class="difflegend"><span class="p">blau</span> = nur im Protokoll (ergänzt) · `
            + `<span class="g">durchgestrichen</span> = nur gesprochen (entfernt) · beides = ersetzt. `
            + `Differenz = Korrekturrecht der Redner:innen, kein Faktenfehler.</div>`;
          const df = d.diffs || [];
          h += df.length ? df.map((x) =>
            `<div class="rede"><div class="who">${esc(x.sprecher)} <span>· TOP ${x.top ?? "–"} · Rede-WER ${Math.round(x.rede_wer * 100)}%</span></div>${renderDiff(x.segmente)}</div>`).join("")
            : `<div class="empty">Keine nennenswerten Abweichungen.</div>`;
        } else {
          const l = d.inhalts_luecken || [];
          h += `<div class="difflegend">Sätze aus dem amtlichen Protokoll, die im YouTube-ASR kaum vorkommen (Lücke/Abweichung).</div>`;
          h += l.length ? l.slice(0, 40).map((x) =>
            `<div class="rede"><div class="who">${esc(x.sprecher)} <span>· Abdeckung ${Math.round((x.abdeckung || 0) * 100)}%</span></div><div class="diff"><span class="p">${esc(x.satz)}</span></div></div>`).join("")
            : `<div class="empty">Keine Inhalts-Lücken erfasst.</div>`;
        }
        m.innerHTML = h;
        const cb = m.querySelector(".close");
        if (cb) cb.focus();  // Tastatur-Fokus in den Dialog setzen
      }
      function exportReview() {
        const rev = loadReview(current);
        const korrekturen = Object.entries(rev).map(([id, e]) => ({
          faktencheck_id: id, person: e.person, aussage: e.aussage, verdikt_alt: e.verdikt_alt,
          status: e.status, verdikt_neu: e.verdikt_neu || null, notiz: e.notiz || "", stand: e.ts,
        }));
        const out = { sitzung: current, geprueft_von: "Reviewer (Pages-Prototyp)",
                      stand: new Date().toISOString(), anzahl: korrekturen.length, korrekturen };
        const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `korrekturen_${current}.json`;
        a.click();
        URL.revokeObjectURL(a.href);
      }
      function applyReview(fcEl, kind) {
        const id = fcEl.dataset.fcid, rev = loadReview(current);
        const base = { person: fcEl.dataset.person, aussage: fcEl.dataset.aussage,
                       verdikt_alt: fcEl.dataset.verdikt, ts: new Date().toISOString() };
        if (kind === "ok") rev[id] = { ...base, status: "bestätigt" };
        else if (kind === "rej") rev[id] = { ...base, status: "abgelehnt" };
        else if (kind === "cor") {
          const v = (prompt("Korrigiertes Verdikt (" + VERDIKTE.join(" / ") + "):", fcEl.dataset.verdikt) || "").trim().toLowerCase();
          if (!VERDIKTE.includes(v)) { if (v) alert("Unbekanntes Verdikt: " + v); return; }
          const n = prompt("Begründung der Korrektur (optional):", "") || "";
          rev[id] = { ...base, status: "korrigiert", verdikt_neu: v, notiz: n };
        }
        saveReview(current, rev);
        if (curData) renderFactcheck(curData);  // Badge + Zähler aktualisieren
      }
      document.addEventListener("click", (ev) => {
        const gl = ev.target.closest(".gaplink");
        if (gl) { ev.preventDefault(); openGap(gl.dataset.file); return; }
        const pv = ev.target.closest(".playvid");
        if (pv) { ev.preventDefault(); playVideo(pv.dataset); return; }
        if (ev.target.closest(".close") || ev.target.id === "gapOverlay" || ev.target.id === "videoOverlay") { closeGap(); return; }
        if (ev.target.id === "revExport") { exportReview(); return; }
        const rb = ev.target.closest(".review button[data-rev]");
        if (rb) { applyReview(rb.closest(".fc"), rb.dataset.rev); }
      });
      document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") closeGap(); });

      function setView() {
        $("dash").style.display = dashOn ? "grid" : "none";
        $("wrap").style.display = dashOn ? "none" : "flex";
        $("viewToggle").classList.toggle("active", dashOn);
        $("viewToggle").textContent = dashOn ? "🕸️ Graph" : "📊 Dashboard";
        if (dashOn) loadDash(current);
        else requestAnimationFrame(sizeGraph);  // beim Zurückschalten Canvas neu vermessen
      }

      // Quelle umschalten: 🟢 Offiziell (amtliches XML + Mediathek-Video) ↔ 🎬 YouTube.
      function setSrcButtons() {
        const e = curSession || {};
        const off = $("srcOff"), yt = $("srcYt");
        off.disabled = !e.amtlich; yt.disabled = !e.youtube;
        off.style.opacity = e.amtlich ? "1" : ".4"; yt.style.opacity = e.youtube ? "1" : ".4";
        yt.title = e.youtube ? "YouTube-Gesamtmitschnitt (Zeit-Deeplinks)"
          : "Kein YouTube-Gesamtmitschnitt für diese Sitzung (nur 79/81 verfügbar)";
        off.classList.toggle("active", curSrc === "off"); yt.classList.toggle("active", curSrc === "yt");
      }
      function loadSession(e, src) {
        if (!e) return;
        curSession = e;
        curSrc = (src === "yt" && e.youtube) ? "yt" : "off";
        current = curSrc === "yt" ? e.youtube.name : (e.amtlich && e.amtlich.name);
        setSrcButtons();
        dashOn ? loadDash(current) : load(current);
      }
      $("srcOff").addEventListener("click", () => curSession && curSession.amtlich && loadSession(curSession, "off"));
      $("srcYt").addEventListener("click", () => curSession && curSession.youtube && loadSession(curSession, "yt"));
      $("viewToggle").addEventListener("click", () => { dashOn = !dashOn; setView(); });

      // Protokoll: HTML-Protokoll der aktuellen Quelle (Transkript + Quellen + Deeplinks,
      // korrekte Umlaute); sonst amtliches PDF; sonst TTS-Textfassung.
      $("a11y").addEventListener("click", () => {
        const e = curSession || {};
        const prot = curSrc === "yt" ? (e.youtube && e.youtube.protokoll) : (e.amtlich && e.amtlich.protokoll);
        if (prot) window.open(`./data/${prot}`, "_blank");
        else if (e.amtlich && e.amtlich.pdf) window.open(e.amtlich.pdf, "_blank");
        else if (current) window.open(`./data/${current}_barrierefrei.txt`, "_blank");
      });

      // Reale Sitzungen aus dem Index in den Auswahlknopf füllen + neueste laden.
      async function loadSessions() {
        try { const idx = await (await fetch(`./data/sessions.json?v=${Date.now()}`)).json(); SESSIONS = idx.sessions || []; }
        catch { SESSIONS = []; }
        const sel = $("sessions");
        if (!SESSIONS.length) { sel.style.display = "none"; return; }
        sel.innerHTML = SESSIONS.map((e) => {
          const tags = (e.youtube ? "🎬" : "") + (e.amtlich ? "🟢" : "");
          return `<option value="${e.wp}-${e.nr}">${tags} ${e.nr}. Sitzung${e.datum ? " · " + e.datum : ""}</option>`;
        }).join("");
        sel.addEventListener("change", () =>
          loadSession(SESSIONS.find((x) => `${x.wp}-${x.nr}` === sel.value), "off"));
        // Start: neueste WP21-Sitzung mit committetem Graphen (zeigt Graph + Mediathek-
        // Deeplinks + aktivierbaren YouTube-Umschalter) statt der WP20-Altsitzung.
        const start = SESSIONS.find((e) => e.wp === "21" && e.amtlich && e.amtlich.graph) || SESSIONS[0];
        sel.value = `${start.wp}-${start.nr}`;
        loadSession(start, "off");
      }

      window.addEventListener("resize", sizeGraph);
      initGraph();
      renderLegend(null);
      loadSessions();
      requestAnimationFrame(sizeGraph);
    </script>
  </body>
</html>
