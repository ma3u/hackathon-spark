name: Deploy GitHub Pages

# Veröffentlicht die statische Seite unter web/ (3D-Graph + Faktencheck).
# Kein Build nötig — reine statische Auslieferung des web/-Verzeichnisses.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Graph-Daten frisch erzeugen (stdlib, kein GPU/Netz)
        run: python3 run_demo.py --no-queries
      - name: Amtliches XML-Szenario (fiktives Sample) erzeugen
        run: python3 ingest_bundestag.py
      - name: Echtes Plenarprotokoll-Szenario erzeugen (gemeinfrei, ohne Faktencheck über reale Personen)
        run: python3 ingest_bundestag.py --xml data/real/plenarprotokoll-20-214.xml --name bundestag_real --no-factcheck
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - id: deployment
        uses: actions/deploy-pages@v4
