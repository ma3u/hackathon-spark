# Lokales Neo4j 5 für den Import + Neo4j-GraphRAG.
#   docker compose -f docker-compose.neo4j.yml up -d
#   python ingest_bundestag.py --xml <prot>.xml --load
#   Browser: http://localhost:7474  (neo4j / healthdataspace)
services:
  neo4j:
    image: neo4j:5-community
    container_name: graph-protokoll-neo4j
    ports:
      - "7474:7474" # HTTP / Browser
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: "neo4j/healthdataspace"
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
volumes:
  neo4j_data:
